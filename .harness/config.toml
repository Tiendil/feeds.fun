# Codex roles. Fragment paths are relative to the repository root.
# Generate .codex/agents/ with mise run harness:codex:roles:generate.
[[roles.role]]
name = "default"
description = "Primary agent responsible for task completion, agent coordination, and communication with the developer."
fragments = [
  ".vendor/shared-harness/workers/roles/primary.md",
  ".vendor/shared-harness/workers/behaviors/communication.md",
  ".vendor/shared-harness/workers/behaviors/consent.md",
  ".vendor/shared-harness/workers/behaviors/write_ownership.md",
  ".vendor/shared-harness/workers/behaviors/writing_tests_prohibited.md",
  ".vendor/shared-harness/workers/behaviors/complex_research_prohibited.md",
  ".vendor/shared-harness/workers/behaviors/final_review_prohibited.md",
]

[[roles.role]]
name = "qa_automation"
description = "The only agent allowed to change QA automation code and tests. Other agents must delegate that work to this agent."
