name: code checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      branch_ref:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.branch_ref }}
  cancel-in-progress: true

jobs:

  run-dev-checks:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: Pull containers
        # postgresql is dependency of backend-utils
        run: mise run docker:pull:postgresql

      - name: Build containers
        run: mise run docker:build

      - name: Check code formatting
        run: mise run check:format

      - name: Check types
        run: mise run check:semantics

      - name: Check code spelling
        run: mise run check:spelling

      - name: Run backend tests
        run: mise run backend:test

      - name: Run frontend tests
        run: mise run frontend:test

  run-prod-checks:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: check ffun cli is runnable in prod
        run: mise run check:runtime
