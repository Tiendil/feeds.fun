name: code checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      branch_ref:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.branch_ref }}
  cancel-in-progress: true

jobs:

  check-harness:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Fetch shared harness
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: 'url.https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'git@github.com:'
        run: mise bootstrap repos apply --yes

      - name: Check harness source lock
        run: mise run harness:lock:check

  run-dev-checks:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: Pull containers
        # postgresql is dependency of backend-utils
        run: mise run docker:pull:postgresql

      - name: Build containers
        run: mise run docker:build

      - name: Check code formatting
        run: mise run check:format

      - name: Check types
        run: mise run check:semantics

      - name: Check code spelling
        run: mise run check:spelling

      - name: Run backend tests
        run: mise run backend:test

      - name: Run frontend tests
        run: mise run frontend:test

  run-prod-checks:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.8'
          install: false

      - name: check ffun cli is runnable in prod
        run: mise run check:runtime
