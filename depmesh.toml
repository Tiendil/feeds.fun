output = { type = "files", pattern = "@/specs/backend_architecture/modules/*.md" }

# Backend Python files are governed by backend architecture and the shared programming rules the backend adopts.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/ffun/ffun/**/*.py" }
output = { type = "union", items = [
  { type = "files", pattern = "@/specs/backend_architecture/*.md" },
  { type = "list", artifacts = [
    "@/specs/backend_architecture/roles/errors.md",
    "@/specs/programming/dto.md",
    "@/specs/programming/postgresql.md",
  ] },
] }

# Backend architecture and the shared programming rules it adopts govern backend Python files.
[[rules]]
relation = "governs"
input = { type = "any", items = [
  { type = "glob", pattern = "@/specs/backend_architecture/*.md" },
