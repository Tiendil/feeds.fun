version = 1

#############################
# Relation: tested_by / tests
#############################

[[relations]]
id = "tested_by"
description = "Tests that verify the artifact."

[[relations]]
id = "tests"
description = "Artifacts verified by the test."

# Backend package initializers are verified by matching tests/test_init.py files.
[[rules]]
relation = "tested_by"
input = { type = "all", items = [
  { type = "glob", pattern = "@/ffun/ffun/{**package_path}/__init__.py" },
  { type = "not", item = { type = "glob", pattern = "@/ffun/ffun/**/tests/**/*.py" } },
] }
output = { type = "files", pattern = "@/ffun/ffun/{package_path}/tests/test_init.py" }

# Regular backend modules are verified by sibling tests/test_<module>.py files.
[[rules]]
relation = "tested_by"
input = { type = "all", items = [
  { type = "glob", pattern = "@/ffun/ffun/{**package_path}/{*module}.py" },
  { type = "not", item = { type = "glob", pattern = "@/ffun/ffun/**/__init__.py" } },
  { type = "not", item = { type = "glob", pattern = "@/ffun/ffun/**/tests/**/*.py" } },
  { type = "not", item = { type = "glob", pattern = "@/ffun/ffun/**/migrations/*.py" } },
] }
output = { type = "files", pattern = "@/ffun/ffun/{package_path}/tests/test_{module}.py" }

# Backend tests/test_init.py maps back to the package initializer it verifies.
[[rules]]
relation = "tests"
input = { type = "glob", pattern = "@/ffun/ffun/{**package_path}/tests/test_init.py" }
output = { type = "list", artifacts = ["@/ffun/ffun/{package_path}/__init__.py"] }

# Backend tests/test_<module>.py maps back to the module it verifies.
[[rules]]
relation = "tests"
input = { type = "glob", pattern = "@/ffun/ffun/{**package_path}/tests/test_{*module}.py" }
output = { type = "list", artifacts = ["@/ffun/ffun/{package_path}/{module}.py"] }

# Frontend shared logic modules are verified by matching logic/tests/*.test.ts files.
[[rules]]
relation = "tested_by"
input = { type = "glob", pattern = "@/site/src/logic/{*module}.ts" }
output = { type = "files", pattern = "@/site/src/logic/tests/{module}.test.ts" }

# Frontend shared logic tests map back to the module they verify.
[[rules]]
relation = "tests"
input = { type = "glob", pattern = "@/site/src/logic/tests/{*module}.test.ts" }
output = { type = "list", artifacts = ["@/site/src/logic/{module}.ts"] }

# Frontend application components and the global registry are verified by the component registration architecture test.
[[rules]]
relation = "tested_by"
input = { type = "any", items = [
  { type = "one_of", artifacts = ["@/site/src/main.ts"] },
  { type = "all", items = [
    { type = "glob", pattern = "@/site/src/**/*.vue" },
    { type = "not", item = { type = "one_of", artifacts = ["@/site/src/App.vue"] } },
    { type = "not", item = { type = "glob", pattern = "@/site/src/views/**/*.vue" } },
  ] },
] }
output = { type = "list", artifacts = ["@/site/src/tests/componentRegistration.test.ts"] }

# The component registration architecture test maps back to the global registry and every application component.
[[rules]]
relation = "tests"
input = { type = "one_of", artifacts = ["@/site/src/tests/componentRegistration.test.ts"] }
output = { type = "union", items = [
  { type = "list", artifacts = ["@/site/src/main.ts"] },
  { type = "difference", include = { type = "files", pattern = "@/site/src/**/*.vue" }, exclude = { type = "union", items = [
    { type = "list", artifacts = ["@/site/src/App.vue"] },
    { type = "files", pattern = "@/site/src/views/**/*.vue" },
  ] } },
] }

################################
# Relation: governed_by / governs
################################

[[relations]]
id = "governed_by"
description = "Specifications that apply to the artifact."

[[relations]]
id = "governs"
description = "Artifacts governed by the specification."

# Every specification, including copied specifications, is governed by the general meta specifications.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/**/*.md" }
output = { type = "list", artifacts = [
  "@/specs/meta/format.md",
  "@/specs/meta/content.md",
  "@/specs/meta/directories.md",
  "@/specs/meta/dictionary.md",
  "@/specs/meta/language.md",
] }

# General meta specifications govern every specification document.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = [
  "@/specs/meta/format.md",
  "@/specs/meta/content.md",
  "@/specs/meta/directories.md",
  "@/specs/meta/dictionary.md",
  "@/specs/meta/language.md",
] }
output = { type = "files", pattern = "@/specs/**/*.md" }

# Software specifications are additionally governed by programming content requirements.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/specs/backend_architecture/**/*.md" },
  { type = "glob", pattern = "@/specs/frontend_architecture/**/*.md" },
  { type = "glob", pattern = "@/specs/behavior/**/*.md" },
  { type = "glob", pattern = "@/specs/programming/**/*.md" },
  { type = "glob", pattern = "@/specs/python/**/*.md" },
  { type = "glob", pattern = "@/specs/typescript/**/*.md" },
  { type = "one_of", artifacts = ["@/specs/meta/backend_modules.md"] },
] }
output = { type = "list", artifacts = ["@/specs/programming/content.md"] }

# Programming content requirements govern software specifications, including copied specifications.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/programming/content.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/specs/backend_architecture/**/*.md" },
  { type = "files", pattern = "@/specs/frontend_architecture/**/*.md" },
  { type = "files", pattern = "@/specs/behavior/**/*.md" },
  { type = "files", pattern = "@/specs/programming/**/*.md" },
  { type = "files", pattern = "@/specs/python/**/*.md" },
  { type = "files", pattern = "@/specs/typescript/**/*.md" },
  { type = "list", artifacts = ["@/specs/meta/backend_modules.md"] },
] }

# The shared modules and roles spec governs all backend and frontend architecture specs.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/specs/backend_architecture/**/*.md" },
  { type = "glob", pattern = "@/specs/frontend_architecture/**/*.md" },
] }
output = { type = "list", artifacts = ["@/specs/programming/modules_and_roles.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/programming/modules_and_roles.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/specs/backend_architecture/**/*.md" },
  { type = "files", pattern = "@/specs/frontend_architecture/**/*.md" },
] }

# Copied code conventions apply to backend, frontend, and repository utility source code.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/ffun/**/*.py" },
  { type = "glob", pattern = "@/site/src/**/*.ts" },
  { type = "glob", pattern = "@/site/src/**/*.vue" },
  { type = "glob", pattern = "@/site/*.ts" },
  { type = "glob", pattern = "@/site/*.js" },
  { type = "glob", pattern = "@/bin/**/*.py" },
  { type = "glob", pattern = "@/bin/**/*.sh" },
  { type = "one_of", artifacts = ["@/mise.toml"] },
  { type = "glob", pattern = "@/.mise/tasks/*.toml" },
] }
output = { type = "list", artifacts = ["@/specs/programming/code.md"] }

# Copied code conventions govern project source code in both runtime and tooling directories.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/programming/code.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/ffun/**/*.py" },
  { type = "files", pattern = "@/site/src/**/*.ts" },
  { type = "files", pattern = "@/site/src/**/*.vue" },
  { type = "files", pattern = "@/site/*.ts" },
  { type = "files", pattern = "@/site/*.js" },
  { type = "files", pattern = "@/bin/**/*.py" },
  { type = "files", pattern = "@/bin/**/*.sh" },
  { type = "list", artifacts = ["@/mise.toml"] },
  { type = "files", pattern = "@/.mise/tasks/*.toml" },
] }

# Python specifications govern project Python files and the backend layout.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/ffun/ffun/**/*.py" },
  { type = "glob", pattern = "@/bin/**/*.py" },
  { type = "glob", pattern = "@/feeds_collections/**/*.py" },
  { type = "one_of", artifacts = ["@/specs/backend_architecture/modules_and_roles.md"] },
] }
output = { type = "files", pattern = "@/specs/python/**/*.md" }

[[rules]]
relation = "governs"
input = { type = "glob", pattern = "@/specs/python/**/*.md" }
output = { type = "union", items = [
  { type = "files", pattern = "@/ffun/ffun/**/*.py" },
  { type = "files", pattern = "@/bin/**/*.py" },
  { type = "files", pattern = "@/feeds_collections/**/*.py" },
  { type = "list", artifacts = ["@/specs/backend_architecture/modules_and_roles.md"] },
] }

# TypeScript specifications govern project TypeScript files and the frontend test architecture.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/site/src/**/*.ts" },
  { type = "glob", pattern = "@/site/*.ts" },
  { type = "one_of", artifacts = ["@/specs/frontend_architecture/tests.md"] },
] }
output = { type = "files", pattern = "@/specs/typescript/**/*.md" }

[[rules]]
relation = "governs"
input = { type = "glob", pattern = "@/specs/typescript/**/*.md" }
output = { type = "union", items = [
  { type = "files", pattern = "@/site/src/**/*.ts" },
  { type = "files", pattern = "@/site/*.ts" },
  { type = "list", artifacts = ["@/specs/frontend_architecture/tests.md"] },
] }

# Shared test conventions govern both test suites, backend test setup, the backend layout, and the frontend test architecture.
[[rules]]
relation = "governed_by"
input = { type = "any", items = [
  { type = "glob", pattern = "@/ffun/ffun/**/tests/**/*.py" },
  { type = "glob", pattern = "@/site/src/**/*.test.ts" },
  { type = "one_of", artifacts = [
    "@/ffun/ffun/conftest.py",
    "@/ffun/ffun/pytest_plugin.py",
    "@/specs/backend_architecture/modules_and_roles.md",
    "@/specs/frontend_architecture/tests.md",
  ] },
] }
output = { type = "list", artifacts = ["@/specs/programming/tests.md"] }

[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/programming/tests.md"] }
output = { type = "union", items = [
  { type = "files", pattern = "@/ffun/ffun/**/tests/**/*.py" },
  { type = "files", pattern = "@/site/src/**/*.test.ts" },
  { type = "list", artifacts = [
    "@/ffun/ffun/conftest.py",
    "@/ffun/ffun/pytest_plugin.py",
    "@/specs/backend_architecture/modules_and_roles.md",
    "@/specs/frontend_architecture/tests.md",
  ] },
] }

# CLI command-family specifications are governed by shared CLI behavior.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/behavior/cli/*.md" }
output = { type = "list", artifacts = ["@/specs/behavior/cli.md"] }

# Shared CLI behavior governs every command-family specification.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/behavior/cli.md"] }
output = { type = "files", pattern = "@/specs/behavior/cli/*.md" }

# CLI command-family specifications are governed by matching backend module specifications when they exist.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/behavior/cli/{*module}.md" }
output = { type = "files", pattern = "@/specs/backend_architecture/modules/{module}.md" }

# Backend module specifications govern matching CLI command-family specifications when they exist.
[[rules]]
relation = "governs"
input = { type = "glob", pattern = "@/specs/backend_architecture/modules/{*module}.md" }
output = { type = "files", pattern = "@/specs/behavior/cli/{module}.md" }

# Backend module specifications are additionally governed by their common structure requirements.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/backend_architecture/modules/*.md" }
output = { type = "list", artifacts = ["@/specs/meta/backend_modules.md"] }

# The backend module specification requirements govern every backend module specification.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = ["@/specs/meta/backend_modules.md"] }
output = { type = "files", pattern = "@/specs/backend_architecture/modules/*.md" }

# Backend module specifications are governed by backend database architecture and PostgreSQL conventions.
[[rules]]
relation = "governed_by"
input = { type = "glob", pattern = "@/specs/backend_architecture/modules/*.md" }
output = { type = "list", artifacts = [
  "@/specs/backend_architecture/db.md",
  "@/specs/programming/postgresql.md",
] }

# Backend database architecture and PostgreSQL conventions govern backend module specifications.
[[rules]]
relation = "governs"
input = { type = "one_of", artifacts = [
  "@/specs/backend_architecture/db.md",
  "@/specs/programming/postgresql.md",
