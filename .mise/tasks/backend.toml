["backend:run"]
description = "Run a command in the backend development container"
raw = true
raw_args = true
quiet = true
run = "docker compose --profile dev run --rm backend-utils"

["backend:poetry"]
description = "Run Poetry in the backend development container"
raw = true
raw_args = true
quiet = true
run = "mise run backend:run -- poetry"

["backend:ffun"]
description = "Run the backend CLI in the development container"
raw = true
raw_args = true
quiet = true
run = "mise run backend:poetry -- run ffun"

["backend:yoyo"]
description = "Run Yoyo in the backend development container"
raw = true
raw_args = true
quiet = true
run = "mise run backend:poetry -- run yoyo"

["backend:test"]
description = "Run backend tests"
raw = true
raw_args = true
run = '''
#!/usr/bin/env bash
set -e
mise run backend:poetry -- run pytest "$@" ffun
'''
