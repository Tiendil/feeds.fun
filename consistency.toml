version = 2

mode = "incremental"

runtime_dir = ".session/inconsistency-check"
comparison_base_refs = ["main", "origin/main"]
allowed_file_relations = ["governed_by"]
requires_branch_change = false
# Maximum concurrent validator processes. Reviewers run only for validator-reported candidates.
agent_jobs = 20
# Maximum concurrent depmesh subprocesses in one dependency-discovery wave.
discovery_jobs = 20

[journal]
# Disabled because recursive dependency traversal can produce hundreds of subprocess-backed journal writes.
# Uncomment to restore detailed consistency-check journaling.
# cmd = ["./bin/taskwarior.sh", "log", "+journal", "+consistency", "kind:{kind}", "{message}"]

# Agent-model options, ordered by estimated consistency-check quality.
# Estimates are specific to this project's diff-to-specification workload. Relative cost uses
# gpt-5.6-terra with high reasoning as the 1x baseline; actual speed and cost depend on input size,
# tool use, reasoning tokens, rate limits, and the configured job concurrency.
#
# | Rank | Configuration | Estimated quality | Estimated speed | Estimated cost | Relative cost | Best use |
# | ---: | --- | --- | --- | --- | ---: | --- |
# | 1 | gpt-5.6-sol + xhigh | Maximum, ~5/5 | Very slow | Extreme | ~2.5-4x | Final adjudication |
# | 2 | gpt-5.6-sol + high | Very high, ~4.8/5 | Slow | Very high | ~2x | Critical concurrency, transaction, or migration work |
# | 3 | gpt-5.6-terra + high (RECOMMENDED) | High, ~4.4/5 | Moderate | High | 1x | Regular project-wide consistency checking |
# | 4 | gpt-5.6-terra + medium | Good-high, ~4/5 | Fast | Medium | ~0.6-0.8x | Routine changes after validating checker recall |
# | 5 | gpt-5.6-luna + high | Good, ~3.7/5 | Fast to very fast | Low | ~0.35-0.5x | Large cost-sensitive runs with accepted extra risk |
#
# Current model positioning and API-price proxy: https://developers.openai.com/api/docs/models/compare
#
# Agent command argument reference:
# - `codex exec` runs Codex non-interactively for one validation or review.
# - `--strict-config` rejects configuration keys unknown to the installed Codex version.
# - `--model ...` pins each role's model instead of inheriting a user default.
# - `-c model_reasoning_effort=...` sets role-specific depth: `high` for validation and `xhigh` for review.
# - `-c model_verbosity="low"` keeps the schema-constrained final JSON concise.
# - `-c model_reasoning_summary="none"` suppresses reasoning summaries that this script does not consume.
# - `-c personality="none"` removes conversational style from the machine-oriented checker response.
# - `-c web_search="disabled"` keeps checks deterministic and local to repository evidence.
# - `--cd {project_root}` makes the repository root the child's working directory.
# - `--sandbox read-only` permits repository inspection but prevents child-agent edits.
# - `-c approval_policy="never"` prevents an unattended child from waiting for interactive approval.
# - `--ephemeral` avoids persisting a reusable Codex session for each relation pair.
# - `--output-schema {schema_path}` constrains the final response to the generated agent JSON schema.
# - `--output-last-message {output_path}` writes the final structured response where the script expects it.
# - `-` reads the generated agent prompt from standard input and therefore must remain the last argument.
[agent_validator]
# The validator favors throughput because every positive result is independently reviewed.
cmd = [
  "codex", "exec",
  "--strict-config",
  "--model", "gpt-5.6-terra",
  "-c", "model_reasoning_effort=\"high\"",
  "-c", "model_verbosity=\"low\"",
  "-c", "model_reasoning_summary=\"none\"",
  "-c", "personality=\"none\"",
  "-c", "web_search=\"disabled\"",
  "--cd", "{project_root}",
  "--sandbox", "read-only",
  "-c", "approval_policy=\"never\"",
  "--ephemeral",
  "--output-schema", "{schema_path}",
  "--output-last-message", "{output_path}",
  "-"
]
# Maximum wall-clock time for one validator process; this is enforced by the checker script, not Codex.
timeout_seconds = 3600

[agent_validator.prompt]
template = """
You are checking consistency between project artifacts.

Relation: {pair.relation}
Relation description: {pair.relation_description}

Changed file: {changed.path}

Related file: {related.path}

Comparison base: {git.merge_base}

Instructions:
- Read the files yourself from the workspace.
- Use git diff against the comparison base to identify the current work scope.
- You may read additional project files when necessary to understand the consistency question.
- Do not edit files.
- Report only inconsistencies that are actionable for the current work scope.
- Return JSON only.

Consistency criteria:
{criteria}
"""

[agent_validator.output_schema]
type = "object"
additionalProperties = false
required = ["check_status", "report"]

[agent_validator.output_schema.properties.check_status]
type = "string"
enum = ["consistent", "inconsistent"]

[agent_validator.output_schema.properties.report]
type = "string"

[agent_reviewer]
# The reviewer favors decision quality and runs only for validator-reported candidates.
cmd = [
  "codex", "exec",
  "--strict-config",
  "--model", "gpt-5.6-sol",
  "-c", "model_reasoning_effort=\"xhigh\"",
  "-c", "model_verbosity=\"low\"",
  "-c", "model_reasoning_summary=\"none\"",
  "-c", "personality=\"none\"",
  "-c", "web_search=\"disabled\"",
  "--cd", "{project_root}",
  "--sandbox", "read-only",
  "-c", "approval_policy=\"never\"",
  "--ephemeral",
  "--output-schema", "{schema_path}",
  "--output-last-message", "{output_path}",
  "-"
]
# Maximum wall-clock time for one reviewer process; this is enforced by the checker script, not Codex.
timeout_seconds = 3600

[agent_reviewer.prompt]
template = """
You are the final reviewer for a candidate consistency finding produced by another agent.
Your decision determines whether the project workflow asks a developer to change source files.

Active consistency mode: {mode}
Relation: {pair.relation}
Relation description: {pair.relation_description}

Changed file: {changed.path}
Related file: {related.path}
Comparison base: {git.merge_base}

{fenced_content('Validator candidate report:', validation.report)}

Review instructions:
- Follow the repository's agent instructions while gathering evidence.
- Independently inspect the current workspace files and the relevant git diff; do not trust the candidate report by itself.
- Review only the reported candidate. Do not turn this into a broad audit or introduce unrelated findings.
- Verify that the cited changed hunk exists, the cited related-file rule actually applies, and the claimed contradiction follows.
- Apply the active mode's scope. In `incremental` mode, reject findings that are pre-existing, unrelated to changed hunks, or only made visible by nearby edits. In `strict` mode, a real contradiction may be confirmed even when pre-existing.
- Consider the whole design before confirming. In particular, check natural module ownership, dependency direction, duplicated definitions, unnecessary abstractions, and whether the implied fix would improve rather than merely rearrange the architecture.
- Confirm only a clear, actionable inconsistency whose correction is justified by the governing artifact and improves overall consistency.
- Reject candidates that are ambiguous, speculative, non-actionable, based on an inapplicable rule, or likely to cause unnecessary refactoring or a worse design.
- You may read additional project files when necessary.
- Do not edit files.
- Return JSON only, matching the provided schema.
- `review_status` must be `"confirmed"` or `"rejected"`.
- `report` MUST be Markdown with at least one level-2 heading line starting with `## `.
- Explain the decisive evidence and why a source change is or is not warranted.

Consistency criteria:
{criteria}
"""

[agent_reviewer.output_schema]
type = "object"
additionalProperties = false
required = ["review_status", "report"]

[agent_reviewer.output_schema.properties.review_status]
type = "string"
enum = ["confirmed", "rejected"]

[agent_reviewer.output_schema.properties.report]
type = "string"

[criteria]
common = [
  "No stale names, missing cases, contradictory defaults, or incompatible examples.",
  "Prefer issues introduced by or made actionable by the current work scope over pre-existing whole-file issues.",
]

[relations.governed_by]
description = "Specifications that apply to the artifact."
criteria = [
  "The implementation or artifact must follow the governing specification's behavior and public contract.",
]

[relations.governs]
description = "Artifacts governed by the specification."
criteria = [
  "The specification must accurately describe the governed artifact's visible behavior and public contract.",
]

[relations.tested_by]
description = "Tests that verify the artifact."
criteria = [
  "The test must assert behavior that the implementation actually provides.",
  "The implementation must satisfy the documented intent of the test.",
]

[relations.tests]
description = "Artifacts verified by the test."
criteria = [
  "The tested artifact must match the expectations and edge cases encoded in the test.",
]

[relations.imports]
description = "Backend Python files imported by the artifact."
criteria = [
  "Imported APIs, names, types, side effects, and call signatures must still be available and compatible.",
]

[relations.imported_by]
description = "Backend Python files that import the artifact."
criteria = [
  "Caller code must use available APIs, names, types, side effects, and call signatures correctly.",
]

[relations.terms_defined_by]
description = "Dictionaries that define terms used by the artifact."
criteria = [
  "Dictionary terms used by the artifact must match the dictionary's spelling and meaning.",
]

[relations.defines_terms_for]
description = "Artifacts that use terms from the dictionary."
criteria = [
  "Artifacts using dictionary terms must match the dictionary's spelling and meaning.",
]

[relations.indexed_by]
description = "Indexes that list the specification."
criteria = [
  "Index references must include the artifact correctly and without stale names.",
]

[relations.indexes]
description = "Specifications listed by the index."
criteria = [
  "Indexed artifacts must exist conceptually in the index and match its references.",
]

[modes.strict]
allowed_file_relations = ["governed_by"]
requires_branch_change = false

[modes.strict.agent_validator.prompt]
template = """
You are checking full consistency between project artifacts.

Relation: {pair.relation}
Relation description: {pair.relation_description}

Changed file: {changed.path}

Related file: {related.path}

Comparison base: {git.merge_base}

Instructions:
- Read the files yourself from the workspace.
- You may read additional project files when necessary.
- Do not edit files.
- Report any inconsistency between the changed file and related file, even if it appears pre-existing.
- Return JSON only.

Consistency criteria:
{criteria}
"""

[modes.incremental]
allowed_file_relations = ["governed_by"]
requires_branch_change = true

[modes.incremental.agent_validator.prompt]
template = """
You are an incremental consistency checker.
Your task is to decide whether the current diff introduced a new inconsistency between the changed file and the related file.

Relation: {pair.relation}
Relation description: {pair.relation_description}

Changed file: {changed.path}

Related file: {related.path}

Comparison base: {git.merge_base}

Instructions:
- Read the files yourself from the workspace.
- Start by inspecting `git diff {git.merge_base} -- {changed.path}`.
- Identify the behavior, public contracts, names, defaults, examples, and structure introduced or changed by the diff.
- Use the full changed file, related file, and additional project files only as context for those diff-introduced or diff-changed facts.
- Do not perform a full consistency audit of unrelated parts of the changed file.
- For every possible inconsistency you notice, classify it as one of:
  - introduced by a changed hunk in the current diff;
  - pre-existing and still present;
  - unrelated to the changed hunks;
  - unclear.
- A possible inconsistency is reportable only when you can point to both:
  - a changed hunk that introduces the inconsistency;
  - a related-file requirement, statement, example, or contract contradicted by that introduced hunk.
- A pre-existing inconsistency is not reportable unless a changed hunk introduces a new, independently identifiable contradiction with the related file.
- Do not report a pre-existing inconsistency merely because the current diff is nearby, touches the same function or section, depends on surrounding context, or leaves the old inconsistency unresolved.
- When the link between a changed hunk and an inconsistency is unclear, treat that possible inconsistency as not reportable.
- You may read additional project files when necessary.
- Do not edit files.
- Return `check_status: "inconsistent"` only when there is at least one reportable inconsistency.
- Return `check_status: "consistent"` when there are no reportable inconsistencies, even if you noticed pre-existing, unrelated, or unclear issues.
- Return JSON only, matching the provided schema.
- If `check_status` is `"consistent"`, `report` may be an empty string.
- If `check_status` is `"inconsistent"`, `report` MUST be a Markdown string with at least one level-2 heading line starting with `## `.
- For each reportable inconsistency, format `report` as:

  ## <short finding title>

  Changed hunk: `<changed file>:<line>` introduces <specific changed behavior>.
  Related rule: `<related file>:<line>` requires <specific rule>.
  Problem: <why the introduced change contradicts the related rule>.

Consistency criteria:
{criteria}
"""
