# These processors do not need external API keys, which makes entitlement
# reservation behavior easy to exercise in this example.

[[tag_processors]]
  id = 1
  enabled = true
  workers = 10
  name = "domain"
  type = "domain"

  [[tag_processors.routes]]
    id = "default"
    allowed_for_collections = true
    allowed_for_users = true
    allowed_for_quality_tests = true

