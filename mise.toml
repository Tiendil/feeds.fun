
[vars]
harness_skills = """
session
"""

[bootstrap.repos.".vendor/shared-harness"]
url = "git@github.com:Tiendil/harness.git"
ref = "feature/agents-md-construction"

[dotfiles."AGENTS.md"]
source = ".harness/AGENTS.md.tera"
mode = "template"
permissions = "0644"
variants = [
  { default = true, target = "{{ config_root }}/AGENTS.md" },
]

[tasks."harness:load"]
description = "Update shared harness"
dir = "{{ config_root }}"
run = 'mise bootstrap repos update --yes .vendor/shared-harness'

[tasks."harness:agents.md:generate"]
description = "Regenerate AGENTS.md"
dir = "{{ config_root }}"
run = [
  'mise dot apply --yes "{{ config_root }}/AGENTS.md"',
  '''
generated_agents="$(cog -d "{{ config_root }}/AGENTS.md")" &&
printf '%s\n' "$generated_agents" > "{{ config_root }}/AGENTS.md"
''',
]

[tasks."harness:skills:install"]
description = "Install shared harness skills"
dir = "{{ config_root }}"
env = { HARNESS_SKILLS = "{{ vars.harness_skills }}" }
run = '''
set -eu

mkdir -p .agents/skills

printf '%s\n' "$HARNESS_SKILLS" |
  rsync --archive --recursive --itemize-changes \
    --files-from=- \
    -- \
    .vendor/shared-harness/.agents/skills/ \
    .agents/skills/
'''

[tasks."harness:generate"]
description = "Regenerate harness"
dir = "{{ config_root }}"
depends = [
  "harness:agents.md:generate",
  "harness:skills:install",
]

[tasks."harness:initialize"]
description = "Initialize harness"
dir = "{{ config_root }}"
run = [
  "mise run harness:load",
  "mise run harness:generate"
]
